services:
  - type: web
    name: nbb-gpt-live-ripple-test
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: NBB_ADAPTER_SECRET
        sync: false
      - key: NBB_TEST_SITE_HOST
        value: carpetcleaningannarbor.com
      - key: LIVE_VOICE
        value: ripple
      - key: LEGACY_BRAIN_MODEL
        value: gpt-realtime-2.1
      - key: LOG_TRANSCRIPTS
        value: "1"
